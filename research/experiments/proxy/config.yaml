# Proxy experiment: tiny nanoGPT (~1-3M params). Fast enough for the full attribution battery
# on a free T4 in minutes-1h. This is the primary iteration + keep/kill signal (BUILD_PLAN §2 Phase 2).

seed: 1337
model:        # GPTConfig
  n_layer: 3
  n_head: 6
  n_embd: 192
  block_size: 256
  vocab_size: null   # null -> resolved to 50304 (GPT-2 vocab padded) in trunk
  dropout: 0.0
  bias: false
optim:
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
train:
  batch_size: 64
  grad_accum: 1
  max_steps: 5000
  snapshot_steps: []   # steps at which to capture (w, m, v)
data:
  dir: null            # tokenized shard dir / HF Hub repo (resolved from /kaggle/input else ./data)
snapshot:
  dtype: fp32
