name: CI

# Cheap CPU gates before any code reaches a Kaggle GPU:
#   lint (ruff) · secret scan (gitleaks) · secret-hygiene + bitwise-determinism tests.
# Deliberately does NOT run harness.preflight (check_env asserts installed == the GPU-image
# pins, which won't hold on a CPU runner).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # test_no_secrets_in_git greps the whole tracked tree via `git ls-files`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU torch (unpinned): the determinism test compares two runs of the SAME
      # version, so it holds on any single torch — no need for the GPU-image pin.
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pytest pytest-cov numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest research/tests/ -v --cov=research --cov-report=term-missing
