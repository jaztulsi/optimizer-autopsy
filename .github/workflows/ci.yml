name: CI

# Cheap CPU gate before any code reaches a Kaggle GPU: the secret-hygiene guard
# and the bitwise-determinism test. Deliberately does NOT run harness.preflight
# (check_env asserts installed == the GPU-image pins, which won't hold on CPU).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_no_secrets_in_git greps the whole tracked tree via `git ls-files`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU torch (unpinned): the determinism test compares two runs of the SAME
      # version, so it holds on any single torch — no need for the GPU-image pin.
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pytest numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest research/tests/ -v
